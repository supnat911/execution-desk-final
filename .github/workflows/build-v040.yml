name: Build Execution Desk v0.4.0 Live Execution

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ExecutionDesk_v040_LIVE_EXECUTION.bin
      - .github/workflows/build-v040.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Verify and extract v0.4.0 project
        shell: bash
        run: |
          test -f ExecutionDesk_v040_LIVE_EXECUTION.bin
          unzip -t ExecutionDesk_v040_LIVE_EXECUTION.bin

          rm -rf extracted-v040
          mkdir extracted-v040
          unzip -q ExecutionDesk_v040_LIVE_EXECUTION.bin -d extracted-v040

          PROJECT_DIR="extracted-v040/ExecutionDesk_v040"
          test -f "$PROJECT_DIR/V040_LIVE_EXECUTION_MARKER.txt"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          grep -Fq 'versionName = "0.4.0"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionCode = 7' "$PROJECT_DIR/app/build.gradle.kts"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Verified Execution Desk v0.4.0 at $PROJECT_DIR"

      - name: Build stable signed release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/ExecutionDesk-v040.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: execution-desk-v040-live-execution-apk
          path: ExecutionDesk-v040.apk
          if-no-files-found: error
