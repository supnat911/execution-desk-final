name: Build Execution Desk Final APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Find and extract project package
        shell: bash
        run: |
          echo "Repository files:"
          find . -maxdepth 2 -type f -print

          PACKAGE="$(find . -maxdepth 1 -type f -name '*.bin' | head -n 1)"

          if [ -z "$PACKAGE" ]; then
            echo "::error::No .bin project file was found in the repository root."
            exit 1
          fi

          echo "Using package: $PACKAGE"
          rm -rf extracted-project
          mkdir extracted-project
          unzip -q "$PACKAGE" -d extracted-project

          SETTINGS_FILE="$(find extracted-project -type f -name settings.gradle.kts | head -n 1)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "::error::The project package did not contain settings.gradle.kts."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Build signed release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Locate and verify APK
        shell: bash
        run: |
          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::No release APK was created."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK_PATH"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/ExecutionDesk-FINAL.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-desk-final-apk
          path: ExecutionDesk-FINAL.apk
          if-no-files-found: error
