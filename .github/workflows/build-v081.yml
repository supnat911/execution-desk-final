name: Build Execution Desk v0.8.1 Lunar Campaign Engine

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ExecutionDesk_v081_LUNAR_CAMPAIGN_ENGINE.bin'
      - '.github/workflows/build-v081.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android environment
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Verify and extract v0.8.1 project
        shell: bash
        run: |
          test -f ExecutionDesk_v081_LUNAR_CAMPAIGN_ENGINE.bin

          unzip -t ExecutionDesk_v081_LUNAR_CAMPAIGN_ENGINE.bin

          rm -rf extracted-v081
          mkdir -p extracted-v081

          unzip -q ExecutionDesk_v081_LUNAR_CAMPAIGN_ENGINE.bin \
            -d extracted-v081

          SETTINGS="$(find extracted-v081 -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            | head -1)"

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found at: $PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          grep -Fq 'versionName = "0.8.1"' \
            "$PROJECT_DIR/app/build.gradle.kts"

          grep -Fq 'versionCode = 29' \
            "$PROJECT_DIR/app/build.gradle.kts"

          node --check \
            "$PROJECT_DIR/app/src/main/assets/app.js"

          echo "Execution Desk v0.8.1 source verified."

      - name: Verify signing files
        shell: bash
        run: |
          test -f "$PROJECT_DIR/app/executiondesk-update-key.jks"
          test -f "$PROJECT_DIR/keystore.properties"

          echo "Signing configuration found."

      - name: Build signed release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle :app:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Locate and verify APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not produced."
            find "$PROJECT_DIR/app/build/outputs" -type f || true
            exit 1
          fi

          echo "APK produced:"
          ls -lh "$APK"

          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"

          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose "$APK"
          else
            echo "WARNING: Android 34 apksigner not found at expected path."
            echo "Searching installed build tools..."

            APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
              -type f -name apksigner | sort -V | tail -1)"

            if [ -z "$APKSIGNER" ]; then
              echo "ERROR: apksigner not found."
              exit 1
            fi

            "$APKSIGNER" verify --verbose "$APK"
          fi

          cp "$APK" \
            "$GITHUB_WORKSPACE/ExecutionDesk-v081-Lunar-Campaign-Engine.apk"

      - name: Upload Execution Desk v0.8.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-desk-v081-lunar-campaign-engine-apk
          path: ExecutionDesk-v081-Lunar-Campaign-Engine.apk
          if-no-files-found: error
          retention-days: 30
