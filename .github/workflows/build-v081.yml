name: Build Execution Desk v0.8.1 Lunar Campaign Engine

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'ExecutionDesk_v081_LUNAR_CAMPAIGN_ENGINE.bin'
      - '.github/workflows/build-v081.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Extract v0.8.1 source
        run: |
          mkdir -p extracted-v081
          unzip -q ExecutionDesk_v081_LUNAR_CAMPAIGN_ENGINE.bin -d extracted-v081
          find extracted-v081 -maxdepth 3 -type f | head -50

      - name: Locate Android project
        id: project
        run: |
          SETTINGS="$(find extracted-v081 -type f \( -name settings.gradle.kts -o -name settings.gradle \) | head -1)"
          if [ -z "$SETTINGS" ]; then
            echo "Android project not found in v0.8.1 archive."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Verify v0.8.1
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          grep -R 'versionName = "0.8.1"' app/build.gradle.kts
          grep -R 'versionCode = 29' app/build.gradle.kts

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2.1-bin.zip
          unzip -q gradle-8.2.1-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.2.1/bin" >> "$GITHUB_PATH"

      - name: Build signed release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle --no-daemon clean assembleRelease

      - name: Verify APK exists
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -1)"
          if [ -z "$APK" ]; then
            echo "Release APK was not produced."
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload v0.8.1 APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-desk-v081-lunar-campaign-engine-apk
          path: ${{ steps.project.outputs.dir }}/${{ steps.apk.outputs.path }}
          if-no-files-found: error
