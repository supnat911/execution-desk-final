name: Build Execution Desk v0.6.9 Strategic Add and Chart

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ExecutionDesk_v069_STRATEGIC_ADD_CHART.bin
      - .github/workflows/build-v069.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Verify and extract v0.6.9 project
        shell: bash
        run: |
          test -f ExecutionDesk_v069_STRATEGIC_ADD_CHART.bin
          unzip -t ExecutionDesk_v069_STRATEGIC_ADD_CHART.bin

          rm -rf extracted-v069
          mkdir extracted-v069
          unzip -q ExecutionDesk_v069_STRATEGIC_ADD_CHART.bin -d extracted-v069

          PROJECT_DIR="extracted-v069/ExecutionDesk_v069"
          test -f "$PROJECT_DIR/V069_STRATEGIC_ADD_CHART_MARKER.txt"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          grep -Fq 'versionName = "0.6.9"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionCode = 18' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'next-trade-desk-v1.2.2' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/AppStore.java"
          grep -Fq 'function strategicAddSeed' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'PRICE RUNWAY V2' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'chart-fit-trade' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'LOCATION / GEOMETRY QUALIFIES' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'fresh post-transition structure' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/TradeGrader.java"
          node --check "$PROJECT_DIR/app/src/main/assets/app.js"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Verified Execution Desk v0.6.9 at $PROJECT_DIR"

      - name: Build stable signed release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/ExecutionDesk-v069.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-desk-v069-strategic-add-chart-apk
          path: ExecutionDesk-v069.apk
          if-no-files-found: error
