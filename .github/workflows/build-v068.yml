name: Build Execution Desk v0.6.8 Orderly Execution

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ExecutionDesk_v068_ORDERLY_EXECUTION.bin
      - .github/workflows/build-v068.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Verify and extract v0.6.8 project
        shell: bash
        run: |
          test -f ExecutionDesk_v068_ORDERLY_EXECUTION.bin
          unzip -t ExecutionDesk_v068_ORDERLY_EXECUTION.bin

          rm -rf extracted-v068
          mkdir extracted-v068
          unzip -q ExecutionDesk_v068_ORDERLY_EXECUTION.bin -d extracted-v068

          PROJECT_DIR="extracted-v068/ExecutionDesk_v068"
          test -f "$PROJECT_DIR/V068_ORDERLY_EXECUTION_MARKER.txt"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          grep -Fq 'versionName = "0.6.8"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionCode = 17' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'next-trade-desk-v1.2.2' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/AppStore.java"
          grep -Fq 'function renderSafely' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'function renderInteractiveChartPanel' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'function renderInlineTradeBuilder' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'function renderCompactAccountSummary' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'NEXT EVENT' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'None — re-lock required' "$PROJECT_DIR/app/src/main/assets/app.js"
          node --check "$PROJECT_DIR/app/src/main/assets/app.js"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Verified Execution Desk v0.6.8 at $PROJECT_DIR"

      - name: Build stable signed release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/ExecutionDesk-v068.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-desk-v068-orderly-execution-apk
          path: ExecutionDesk-v068.apk
          if-no-files-found: error
