name: Build Execution Desk v0.7.6 HIP-3 and Performance Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ExecutionDesk_v076_HIP3_PERFORMANCE_AUDIT.bin
      - .github/workflows/build-v076.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"
      - name: Verify and extract v0.7.6 project
        shell: bash
        run: |
          test -f ExecutionDesk_v076_HIP3_PERFORMANCE_AUDIT.bin
          unzip -t ExecutionDesk_v076_HIP3_PERFORMANCE_AUDIT.bin
          rm -rf extracted-v076 && mkdir extracted-v076
          unzip -q ExecutionDesk_v076_HIP3_PERFORMANCE_AUDIT.bin -d extracted-v076
          PROJECT_DIR="extracted-v076/ExecutionDesk_v076"
          test -f "$PROJECT_DIR/V076_HIP3_PERFORMANCE_AUDIT_MARKER.txt"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/executiondesk-update-key.jks"
          grep -Fq 'versionName = "0.7.6"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionCode = 25' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'fetchPerpDexs' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/HyperliquidClient.java"
          grep -Fq '100_000 + dexIndex * 10_000 + index' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/HyperliquidClient.java"
          grep -Fq 'canonicalSymbol' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/MarketEngine.java"
          grep -Fq 'hip3DexesScanned' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/PositionTracker.java"
          grep -Fq 'N/A — PARTIAL' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'Account Balance Candles' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'Daily PnL' "$PROJECT_DIR/app/src/main/assets/app.js"
          node --check "$PROJECT_DIR/app/src/main/assets/app.js"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      - name: Build stable signed release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify and prepare APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/ExecutionDesk-v076.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-desk-v076-hip3-performance-audit-apk
          path: ExecutionDesk-v076.apk
          if-no-files-found: error
