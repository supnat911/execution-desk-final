name: Build Execution Desk v0.2.3 Account Fix

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Extract exact v0.2.3 project
        shell: bash
        run: |
          test -f ExecutionDesk_v023_ACCOUNT_SAVE_FIX.bin
          rm -rf extracted-v023
          mkdir extracted-v023
          unzip -q ExecutionDesk_v023_ACCOUNT_SAVE_FIX.bin -d extracted-v023

          test -f extracted-v023/ExecutionDesk_v023/V023_ACCOUNT_SAVE_MARKER.txt
          grep -q 'versionName = "0.2.3"'             extracted-v023/ExecutionDesk_v023/app/build.gradle.kts

      - name: Build signed v0.2.3 release APK
        working-directory: extracted-v023/ExecutionDesk_v023
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          APK="extracted-v023/ExecutionDesk_v023/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" ExecutionDesk-v023.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-desk-v023-account-fix-apk
          path: ExecutionDesk-v023.apk
          if-no-files-found: error
