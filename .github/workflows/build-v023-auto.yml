name: Build Execution Desk v0.2.3 Auto-Detect

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Find and verify v0.2.3 package
        shell: bash
        run: |
          echo "Repository root files:"
          find . -maxdepth 1 -type f -printf '%f  %s bytes\n'

          PACKAGE="$(find . -maxdepth 1 -type f -iname '*v023*.bin' -print -quit)"

          if [ -z "$PACKAGE" ]; then
            PACKAGE="$(find . -maxdepth 1 -type f -iname '*.bin' -printf '%s %p\n' \
              | sort -nr | head -n 1 | cut -d' ' -f2-)"
          fi

          if [ -z "$PACKAGE" ]; then
            echo "::error::No BIN project package exists in the repository root."
            exit 1
          fi

          echo "Selected package: $PACKAGE"
          unzip -t "$PACKAGE"

          rm -rf extracted-v023
          mkdir extracted-v023
          unzip -q "$PACKAGE" -d extracted-v023

          MARKER="$(find extracted-v023 -type f -name 'V023_ACCOUNT_SAVE_MARKER.txt' -print -quit)"

          if [ -z "$MARKER" ]; then
            echo "::error::The selected package is not the v0.2.3 account-save project."
            echo "Archive contents:"
            find extracted-v023 -maxdepth 3 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$MARKER")"

          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts is missing beside the v0.2.3 marker."
            exit 1
          fi

          if ! grep -Fq 'versionName = "0.2.3"' "$PROJECT_DIR/app/build.gradle.kts"; then
            echo "::error::The package does not declare Android version 0.2.3."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Verified v0.2.3 project at: $PROJECT_DIR"

      - name: Build signed v0.2.3 APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          APK_PATH="$(find "$PROJECT_DIR/app/build/outputs/apk/release" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK_PATH" ]; then
            echo "::error::The release APK was not created."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK_PATH"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/ExecutionDesk-v023.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-desk-v023-apk
          path: ExecutionDesk-v023.apk
          if-no-files-found: error
