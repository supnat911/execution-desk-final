name: Build Execution Desk v0.7.2 Account Basis and Runway Hotfix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ExecutionDesk_v072_ACCOUNT_BASIS_RUNWAY_HOTFIX.bin
      - .github/workflows/build-v072.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Verify and extract v0.7.2 project
        shell: bash
        run: |
          test -f ExecutionDesk_v072_ACCOUNT_BASIS_RUNWAY_HOTFIX.bin
          unzip -t ExecutionDesk_v072_ACCOUNT_BASIS_RUNWAY_HOTFIX.bin

          rm -rf extracted-v072
          mkdir extracted-v072
          unzip -q ExecutionDesk_v072_ACCOUNT_BASIS_RUNWAY_HOTFIX.bin -d extracted-v072

          PROJECT_DIR="extracted-v072/ExecutionDesk_v072"
          test -f "$PROJECT_DIR/V072_ACCOUNT_BASIS_RUNWAY_HOTFIX_MARKER.txt"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          grep -Fq 'versionName = "0.7.2"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionCode = 21' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'next-trade-desk-v1.2.2' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/AppStore.java"
          grep -Fq 'fetchUserAbstraction' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/HyperliquidClient.java"
          grep -Fq 'profileAccountValue' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/PositionTracker.java"
          grep -Fq 'perpAccountValueMeaningful' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/PositionTracker.java"
          grep -Fq 'accountValueHistory' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'pnlHistory' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'obviousSourceSwitch' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'runwayVisibleLabels' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'BULLISH PRESSURE' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'runwayIntensity' "$PROJECT_DIR/app/src/main/assets/styles.css"
          grep -Fq '<b>Performance</b>' "$PROJECT_DIR/app/src/main/assets/index.html"
          node --check "$PROJECT_DIR/app/src/main/assets/app.js"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Verified Execution Desk v0.7.2 at $PROJECT_DIR"

      - name: Build stable signed release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/ExecutionDesk-v072.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-desk-v072-account-basis-runway-apk
          path: ExecutionDesk-v072.apk
          if-no-files-found: error
