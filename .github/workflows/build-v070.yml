name: Build Execution Desk v0.7.0 Performance and Growth

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ExecutionDesk_v070_PERFORMANCE_GROWTH.bin
      - .github/workflows/build-v070.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Verify and extract v0.7.0 project
        shell: bash
        run: |
          test -f ExecutionDesk_v070_PERFORMANCE_GROWTH.bin
          unzip -t ExecutionDesk_v070_PERFORMANCE_GROWTH.bin

          rm -rf extracted-v070
          mkdir extracted-v070
          unzip -q ExecutionDesk_v070_PERFORMANCE_GROWTH.bin -d extracted-v070

          PROJECT_DIR="extracted-v070/ExecutionDesk_v070"
          test -f "$PROJECT_DIR/V070_PERFORMANCE_GROWTH_MARKER.txt"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          grep -Fq 'versionName = "0.7.0"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionCode = 19' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'next-trade-desk-v1.2.2' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/AppStore.java"
          grep -Fq 'KEY_PERFORMANCE' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/AppStore.java"
          grep -Fq 'savePerformance' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/MainActivity.java"
          grep -Fq 'Performance & growth' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'Equity candles' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'Copy full journal' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'Watchlist and mapped levels' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq '<b>Performance</b>' "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -Fq '<b>Setup</b>' "$PROJECT_DIR/app/src/main/assets/index.html"
          node --check "$PROJECT_DIR/app/src/main/assets/app.js"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Verified Execution Desk v0.7.0 at $PROJECT_DIR"

      - name: Build stable signed release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/ExecutionDesk-v070.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-desk-v070-performance-growth-apk
          path: ExecutionDesk-v070.apk
          if-no-files-found: error
