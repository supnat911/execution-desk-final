name: Build Execution Desk v0.6.0 Dual Track

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ExecutionDesk_v060_DUAL_TRACK.bin
      - .github/workflows/build-v060.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Verify and extract v0.6.0 project
        shell: bash
        run: |
          test -f ExecutionDesk_v060_DUAL_TRACK.bin
          unzip -t ExecutionDesk_v060_DUAL_TRACK.bin

          rm -rf extracted-v060
          mkdir extracted-v060
          unzip -q ExecutionDesk_v060_DUAL_TRACK.bin -d extracted-v060

          PROJECT_DIR="extracted-v060/ExecutionDesk_v060"
          test -f "$PROJECT_DIR/V060_DUAL_TRACK_MARKER.txt"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          grep -Fq 'versionName = "0.6.0"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionCode = 9' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'bestIntraday' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'target1d' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'exportDiagnosticReport' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'bestCandidateByTrack' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/TradeGrader.java"
          grep -Fq 'autoIntraday' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/TradeGrader.java"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Verified Execution Desk v0.6.0 at $PROJECT_DIR"

      - name: Build stable signed release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/ExecutionDesk-v060.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-desk-v060-dual-track-apk
          path: ExecutionDesk-v060.apk
          if-no-files-found: error
