name: Build Execution Desk v0.7.5 Account Balance History

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ExecutionDesk_v075_ACCOUNT_BALANCE_HISTORY.bin
      - .github/workflows/build-v075.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Verify and extract v0.7.5 project
        shell: bash
        run: |
          test -f ExecutionDesk_v075_ACCOUNT_BALANCE_HISTORY.bin
          unzip -t ExecutionDesk_v075_ACCOUNT_BALANCE_HISTORY.bin
          rm -rf extracted-v075
          mkdir extracted-v075
          unzip -q ExecutionDesk_v075_ACCOUNT_BALANCE_HISTORY.bin -d extracted-v075
          PROJECT_DIR="extracted-v075/ExecutionDesk_v075"
          test -f "$PROJECT_DIR/V075_ACCOUNT_BALANCE_HISTORY_MARKER.txt"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/executiondesk-update-key.jks"
          grep -Fq 'versionName = "0.7.5"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionCode = 24' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'schema:6' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'Account Balance Candles' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'Account Balance Line' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'Net capital flow' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'Raw balance equation' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'PRICE RUNWAY V2.4' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'guardCandidateAgainstActiveThesis' "$PROJECT_DIR/app/src/main/assets/app.js"
          node --check "$PROJECT_DIR/app/src/main/assets/app.js"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build stable signed release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/ExecutionDesk-v075.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-desk-v075-account-balance-history-apk
          path: ExecutionDesk-v075.apk
          if-no-files-found: error
