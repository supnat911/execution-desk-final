name: Build Execution Desk v0.6.3 Bias Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ExecutionDesk_v063_BIAS_INTEGRITY.bin
      - .github/workflows/build-v063.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.2.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2.1"

      - name: Verify and extract v0.6.3 project
        shell: bash
        run: |
          test -f ExecutionDesk_v063_BIAS_INTEGRITY.bin
          unzip -t ExecutionDesk_v063_BIAS_INTEGRITY.bin

          rm -rf extracted-v063
          mkdir extracted-v063
          unzip -q ExecutionDesk_v063_BIAS_INTEGRITY.bin -d extracted-v063

          PROJECT_DIR="extracted-v063/ExecutionDesk_v063"
          test -f "$PROJECT_DIR/V063_BIAS_INTEGRITY_MARKER.txt"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          grep -Fq 'versionName = "0.6.3"' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'versionCode = 12' "$PROJECT_DIR/app/build.gradle.kts"
          grep -Fq 'bias-integrity-v1.2.1' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/AppStore.java"
          grep -Fq 'biasInvalidationEvent' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/MarketAnalyzer.java"
          grep -Fq 'biasReestablished' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/MarketAnalyzer.java"
          grep -Fq 'TREND_WEAKENING' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/MarketAnalyzer.java"
          grep -Fq 'lockSchema' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/MarketEngine.java"
          grep -Fq 'STALE/INVALIDATED BIAS' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/TradeGrader.java"
          grep -Fq 'lastSuccessfulAccountValue' "$PROJECT_DIR/app/src/main/java/com/executiondesk/monitor/PositionTracker.java"
          grep -Fq 'Review manual override' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'Sizing equity / risk-model equity' "$PROJECT_DIR/app/src/main/assets/app.js"
          grep -Fq 'Manual override requires a written reason' "$PROJECT_DIR/app/src/main/assets/app.js"
          node --check "$PROJECT_DIR/app/src/main/assets/app.js"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Verified Execution Desk v0.6.3 at $PROJECT_DIR"

      - name: Build stable signed release APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Verify and prepare APK
        shell: bash
        run: |
          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/ExecutionDesk-v063.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: execution-desk-v063-bias-integrity-apk
          path: ExecutionDesk-v063.apk
          if-no-files-found: error
